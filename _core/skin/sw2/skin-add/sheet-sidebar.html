<div style="position:absolute;bottom:4px;left:4px;" id="appendTextConsole"></div>
<script src="https://shunshun94.github.io/shared/jquery/com/hiyoko/util/v2/utils.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
var io = {};
io.github = io.github || {};
io.github.shunshun94 = io.github.shunshun94 || {};
io.github.shunshun94.ytsheet = io.github.shunshun94.ytsheet || {};
io.github.shunshun94.ytsheet.addSkin = io.github.shunshun94.ytsheet.addSkin || {};

io.github.shunshun94.ytsheet.addSkin.param = com.hiyoko.util.getQueries();

const sheetIdentifier = (io.github.shunshun94.ytsheet.addSkin.param.url) ? `url=${io.github.shunshun94.ytsheet.addSkin.param.url}` : `id=${io.github.shunshun94.ytsheet.addSkin.param.id}`;
const userIdCandiate = /ytsheet2=(\d+)/.exec(document.cookie);
const userId = (userIdCandiate) ? userIdCandiate[1] : '';
// 編集画面は自鯖では一部のユーザにだけ解放している
const isTargetUser = ['302451274706583553', '413974037501313024', '458592433865883659', '272299464486682624', '214107818947641346'].includes(userId);
const isTargetDomain = ! location.href.includes('hiyo-hitsu.sakura.ne.jp');

/** 便利機能 **/
if( generateType === 'SwordWorld2PC') {
	// チェック機能
	const navUl = document.getElementsByTagName('nav')[0].getElementsByTagName('ul')[0];
	const lastLi = Array.from(navUl.children).at(-1);
	const newMenu = document.createElement('li');
	newMenu.innerHTML = `<a target="_blank" href="https://shunshun94.github.io/shared/other/io/github/shunshun94/trpg/sw2/ytsheet/validation/index.html?target=${ encodeURIComponent(location.href) }"><span>チェック</span></a>`;
	navUl.insertBefore(newMenu, lastLi);

	// Discord共有用リンク
	const markdownLink = document.createElement('li');
	markdownLink.setAttribute('class', 'link-tag');
	const markdownLinkBase = document.createElement('span');
	markdownLinkBase.appendChild(document.createTextNode('Discord共有用リンク'));
	markdownLinkBase.appendChild(document.createElement('br'));
	const markdownLinkInput = document.createElement('input');
	markdownLinkInput.type = 'text';
	markdownLinkInput.value = `[${document.getElementById('character-name').textContent}](${location.href})`;
	markdownLinkInput.onclick = (e) => { e.target.select(); };
	markdownLinkBase.appendChild(markdownLinkInput);
	markdownLink.appendChild(markdownLinkBase);
	document.getElementById('downloadlist').getElementsByTagName('ul')[0].appendChild(markdownLink);
}

if ( generateType === 'SwordWorld2Enemy' ) {
	// 画像ダウンロード機能
	// ささやかな抵抗として透かしを入れておく
	const waterMark = document.createElement('div');
	waterMark.style = `opacity:0.1;position:absolute;top:3em;font-size:5em;transform: rotate(15deg);display:none;`;
	waterMark.innerHTML = userId + '<br/>' + new Date().toLocaleString();
	document.getElementsByTagName('article')[0].append(waterMark);
	const downloadAsPictureButtonBase = document.createElement('li');
	downloadAsPictureButtonBase.setAttribute('id', 'downloadlist-picture');
	const downloadAsPictureButton = document.createElement('a');
	downloadAsPictureButton.appendChild(document.createTextNode('画像形式'));
	downloadAsPictureButtonBase.appendChild(downloadAsPictureButton);
	downloadAsPictureButton.onclick = (e) => {
		Array.from(document.getElementsByClassName('fragments')).forEach((e)=>{ e.style.display = 'none'; });
		document.getElementById('author').style.display = 'none';
		waterMark.style.display = 'block';
		document.getElementsByTagName('article')[0].style.padding = '1em';
		html2canvas(document.getElementsByTagName('article')[0], {
			backgroundColor: null,
			scale: 2
		}).then((canvas) => {
			const link = document.createElement('a');
			link.download = `${document.getElementsByTagName('article')[0].getElementsByTagName('h1')[0].textContent}.png`;
			link.href = canvas.toDataURL();
			link.click();
			document.getElementsByTagName('article')[0].style.padding = '0';
			document.getElementById('author').style.display = 'block';
			waterMark.style.display = 'none';
			Array.from(document.getElementsByClassName('fragments')).forEach((e)=>{ e.style.display = 'block'; });
		});
	};
	if(userId) {
		document.getElementById('downloadlist-zipped').after(downloadAsPictureButtonBase);
	}

	// 剣の欠片機能
	Array.from(document.getElementsByClassName('name')).filter((e)=>{ return e.tagName === 'TD' }).forEach((e, i)=>{
		e.innerHTML = e.innerHTML += `<div style="font-size:70%;background-color:rgba(120, 120, 120, 0.5);" class="fragments">
			剣の欠片：
			<button style="width:1em;" class="fragments-minus" value="${i}">-</button>
			<span style="display:inline-block;width:2em;" class="flagments-count">0</span>
			<button style="width:1em;" class="fragments-plus" value="${i}">+</button></div>`;
	});
	const hpCells = Array.from(document.getElementsByClassName('hp')).filter((e)=>{ return e.tagName === 'TD' });
	hpCells.forEach((e, i)=>{ e.title = e.textContent.trim(); });
	const mpCells = Array.from(document.getElementsByClassName('mp')).filter((e)=>{ return e.tagName === 'TD' });
	mpCells.forEach((e, i)=>{ e.title = e.textContent.trim(); });
	Array.from(document.getElementsByClassName('status')[0].getElementsByTagName('dl')).filter((e)=>{ return e.textContent.includes('抵抗力') }).forEach((dl, i)=>{
		dl.getElementsByTagName('dd')[0].title = /(\d+) \(\d+\)/.exec(dl.getElementsByTagName('dd')[0].textContent)[1];
		dl.getElementsByTagName('dd')[0].className = `regist`;
	});
	document.getElementsByTagName('table')[0].addEventListener('click', (e) => {
		const target = e.target;
		if( (! target.className.startsWith('fragments-')) || target.tagName !== 'BUTTON') {
			return;
		}
		const index = e.target.value;
		const countSpan = document.getElementsByClassName('flagments-count')[index];
		let count = parseInt(countSpan.textContent);
		if(target.className === 'fragments-minus')  {				
			if(count > 0) {
				count--;
			}
		} else {
			count++;
		}
		countSpan.textContent = count;
		hpCells[index].textContent = parseInt(hpCells[index].title) + count * 5;
		mpCells[index].textContent = (parseInt(mpCells[index].title) + count) || mpCells[index].title;
		const totalFragments = Array.from(document.getElementsByClassName('flagments-count')).reduce((sum, span) => {
			return sum + parseInt(span.textContent);
		}, 0);
		const registBonusByFragments = Math.min(4, Math.ceil(totalFragments / 5));
		Array.from(document.getElementsByClassName('regist')).forEach((e)=>{ e.textContent = `${parseInt(e.title)+registBonusByFragments} (${parseInt(e.title)+registBonusByFragments+7})`; });
	});

	// 剣の欠片の修正値を含めたココフォリアの駒出力機能
	const generateStatusSummary = (characterJsonData, registBonusByFragments) => {
		const result = [];
		const mountSuffix = (characterJsonData.mount && (Number(characterJsonData.lv) - Number(characterJsonData.lvMin))) ? `-${Number(characterJsonData.lv) - Number(characterJsonData.lvMin) + 1}` : '';
		result.push([
			`生命抵抗力：${Number(characterJsonData.vitResist || characterJsonData[`status1${mountSuffix}Vit`]) + registBonusByFragments}（${(Number(characterJsonData.vitResistFix) || Number(characterJsonData[`status1${mountSuffix}Vit`]) + 7) + registBonusByFragments}）`,
			`精神抵抗力：${Number(characterJsonData.mndResist || characterJsonData[`status1${mountSuffix}Mnd`]) + registBonusByFragments}（${(Number(characterJsonData.mndResistFix) || Number(characterJsonData[`status1${mountSuffix}Mnd`]) + 7) + registBonusByFragments}）`
		].join(' '));
		const statusLength = Number(characterJsonData.statusNum);
		for(var i = 0; i < statusLength; i++) {
			result.push('●' + characterJsonData[`status${ i + 1}Style`]);
			result.push([
				characterJsonData[`status${ i + 1}${mountSuffix}Accuracy`] ? `命中：${characterJsonData[`status${ i + 1}${mountSuffix}Accuracy`]}（${characterJsonData[`status${ i + 1}${mountSuffix}AccuracyFix`]}）` : '',
				characterJsonData[`status${ i + 1}${mountSuffix}Damage`] ? `打撃：${characterJsonData[`status${ i + 1}${mountSuffix}Damage`]}`: ''
			].filter((d)=>{return d}).join(' '));
			result.push([
				characterJsonData[`status${ i + 1}${mountSuffix}Evasion`] ? `回避：${characterJsonData[`status${ i + 1}${mountSuffix}Evasion`]}（${characterJsonData[`status${ i + 1}${mountSuffix}EvasionFix`]}）` : '',
				characterJsonData[`status${ i + 1}${mountSuffix}Defense`] ? `防護：${characterJsonData[`status${ i + 1}${mountSuffix}Defense`]}` : ''
			].filter((d)=>{return d}).join(' '));
		}
		result.push('\n特殊能力');
		result.push((characterJsonData.skills || '').replaceAll(/&lt;br&gt;/g, '\n').split('\n').filter((line)=>{
			return /^([●○◯〇△＞▶〆≫☆🗨□☑]|\[[常準主補宣]\]|>>)/.test(line);
		}));
		return result.flat();
	};
	const generateHiyokoCcfoliaJson = (isUseFixedValue = false) =>{
		getJsonData('ccfolia').then((characterJsonData) => {
			output.generateCcfoliaJson(generateType, characterJsonData, location.href).then((jsonString)=>{
				const json = JSON.parse(jsonString);
				json.data.externalUrl = '';
				// 移動力.魔物レベル0ランダムの値 というフォーマットになる
				json.data.initiative = Number('-' + String((parseInt((/\d+/.exec(characterJsonData.mobility) || ['00'])[0]))).padStart(2, '0') + '.' + String(characterJsonData.lv || '00').padStart(2, '0') + '0' + String(Math.floor((Math.random() * 100) % 100)).padStart(2, '0'));
				if(isUseFixedValue) {
					json.data.commands = json.data.commands.split('\n').map((l)=>{
						if(l.startsWith('2d') && ! l.includes('ダメージ')) {
							return l.replace(/2d[^\s]*/, `C($&)`).replace('2d', '7')
						} else {
							return l;
						}
					}).join('\n');
				}
				json.data.commands += '\n' + Array.from(document.getElementsByClassName('loots')[0]?.getElementsByTagName('dl')[0].children || []).map((elem)=>{return elem.textContent}).map((d, i)=>{
					if( i % 2 ) { return `${d}\n`} else { return `戦利品　${d}：`; }
				}).join('').trim();
				hpCells.forEach((e, i)=>{
					const value = parseInt(e.textContent);
					if( value ) {
						json.data.status[i].value = value;
						json.data.status[i].max = value;
					}
				});
				mpCells.forEach((e, i)=>{
					const value = parseInt(e.textContent);
					if( value ) {
						json.data.status[i + hpCells.length].value = parseInt(e.textContent);
						json.data.status[i + hpCells.length].max = parseInt(e.textContent);
					}
				});
				const totalFragments = Array.from(document.getElementsByClassName('flagments-count')).reduce((sum, span) => {
					return sum + parseInt(span.textContent);
				}, 0);
				const registBonusByFragments = Math.min(4, Math.ceil(totalFragments / 5));
				json.data.params = json.data.params.map((param) => {
					if( param.label.includes('抵抗修正') ) { param.value = String(registBonusByFragments); }
					return param;
				});
				json.data.memo = [
					(totalFragments ? '剣の欠片：' + totalFragments + '個' : ''),
					`種族：${characterJsonData.taxa}　知覚：${characterJsonData.perception}`,
					`弱点：${characterJsonData.weakness}`,
					``, '能力値',
				].concat(generateStatusSummary(characterJsonData, registBonusByFragments)).join('\n').trim();
				popTextareaForCopy(JSON.stringify(json));
			});
		});
	};
	const downloadAsHiyokoCcfoliaJsonWithDiceRollButtonBase = document.createElement('li');
	downloadAsHiyokoCcfoliaJsonWithDiceRollButtonBase.setAttribute('id', 'downloadlist-hiyoko-ccfolia-json-with-dice-roll');
	const downloadAsHiyokoCcfoliaJsonWithDiceRollButton = document.createElement('a');
	downloadAsHiyokoCcfoliaJsonWithDiceRollButton.appendChild(document.createTextNode('ココフォリア用独自コマデータ'));
	downloadAsHiyokoCcfoliaJsonWithDiceRollButton.title = '剣のかけらの修正値を考慮し、イニシアティブ値とメモ欄をカスタムしたココフォリア用のコマデータを出力します';
	const downloadAsHiyokoCcfoliaJsonWithDiceRollSmallNotify = document.createElement('small');
	downloadAsHiyokoCcfoliaJsonWithDiceRollSmallNotify.textContent = '（表示される json をコピーしてココフォリアにはりつけ）';
	downloadAsHiyokoCcfoliaJsonWithDiceRollButton.appendChild(downloadAsHiyokoCcfoliaJsonWithDiceRollSmallNotify);
	downloadAsHiyokoCcfoliaJsonWithDiceRollButtonBase.appendChild(downloadAsHiyokoCcfoliaJsonWithDiceRollButton);
	document.getElementById('downloadlist-ccfolia').after(downloadAsHiyokoCcfoliaJsonWithDiceRollButtonBase);
	downloadAsHiyokoCcfoliaJsonWithDiceRollButton.onclick = (e)=>{generateHiyokoCcfoliaJson();};
	
	const downloadAsHiyokoCcfoliaJsonWithoutDiceRollButtonBase = document.createElement('li');
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButtonBase.setAttribute('id', 'downloadlist-hiyoko-ccfolia-json-without-dice-roll');
	const downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton = document.createElement('a');
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton.appendChild(document.createTextNode('ココフォリア用独自コマデータ（固定値使用）'));
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton.title = '剣のかけらの修正値を考慮し、イニシアティブ値とメモ欄をカスタムしたココフォリア用のコマデータを出力します。命中や回避等のチャットパレットには固定値を用います';
	const downloadAsHiyokoCcfoliaJsonWithoutDiceRollSmallNotify = document.createElement('small');
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollSmallNotify.textContent = '（表示される json をコピーしてココフォリアにはりつけ）';
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton.appendChild(downloadAsHiyokoCcfoliaJsonWithoutDiceRollSmallNotify);
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButtonBase.appendChild(downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton);
	document.getElementById('downloadlist-hiyoko-ccfolia-json-with-dice-roll').after(downloadAsHiyokoCcfoliaJsonWithoutDiceRollButtonBase);
	downloadAsHiyokoCcfoliaJsonWithoutDiceRollButton.onclick = (e)=>{generateHiyokoCcfoliaJson(true);};
}

/** エロステータス編集機能 **/
if((isTargetDomain || isTargetUser) && (generateType === 'SwordWorld2PC')) {
	const navUl = document.getElementsByTagName('nav')[0].getElementsByTagName('ul')[0];
	const lastLi = Array.from(navUl.children).at(-1);
	const newMenu = document.createElement('li');
	newMenu.innerHTML = `<a href="./${location.search}&eroedit=1"><span>エロステ<br/>編集</span></a>`;
	navUl.insertBefore(newMenu, lastLi);
}

const eroColumns = [
	{"columnId":"fPart","columnName":"%E5%88%9D%E4%BD%93%E9%A8%93%E3%81%AE%E7%9B%B8%E6%89%8B","flexBasis":"85%","default":"未経験", "type":"text"},
	{"columnId":"fExp","columnName":"%E5%88%9D%E4%BD%93%E9%A8%93%E3%81%AE%E7%8A%B6%E6%B3%81","flexBasis":"100%","ddStyle":"text-align:left; padding: 8px;","default":"未経験", "type":"text"},

	{"columnId":"pCnt","columnName":"%E7%B5%8C%E9%A8%93%E4%BA%BA%E6%95%B0","flexBasis":"33%","unit":"人","default":"0", "type":"number"},
	{"columnId":"sCnt","columnName":"%E3%82%BB%E3%83%83%E3%82%AF%E3%82%B9","flexBasis":"33%","unit":"回","default":"0", "type":"number"},
	{"columnId":"aCnt","columnName":"%E3%82%A2%E3%83%8A%E3%83%AB","flexBasis":"33%","unit":"回","default":"0", "type":"number"},
	{"columnId":"cCnt","columnName":"%E4%B8%AD%E5%87%BA%E3%81%97","flexBasis":"33%","unit":"回","default":"0", "type":"number"},
	{"columnId":"fCnt","columnName":"%E3%83%95%E3%82%A7%E3%83%A9%E3%83%81%E3%82%AA","flexBasis":"33%","unit":"回","default":"0", "type":"number"},
	{"columnId":"bCnt","columnName":"%E3%83%91%E3%82%A4%E3%82%BA%E3%83%AA","flexBasis":"33%","unit":"回","default":"0", "type":"number"},

	{"columnId":"mExp","columnName":"%E5%8F%A3%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"bExp","columnName":"%E8%83%B8%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"hExp","columnName":"%E5%B0%BB%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"tExp","columnName":"%E4%B9%B3%E9%A6%96%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"gExp","columnName":"%E6%80%A7%E5%99%A8%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"cExp","columnName":"%E3%82%AF%E3%83%AA%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"aExp","columnName":"%E8%82%9B%E9%96%80%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},
	{"columnId":"mExp","columnName":"%E7%B2%BE%E7%A5%9E%E9%96%8B%E7%99%BA%E5%BA%A6","flexBasis":"24%","default":"E", "type":"select", "options": ["A", "B", "C", "D", "E"]},

	{"columnId":"bSta","columnName":"%E4%BB%98%E4%B8%8E%E3%81%95%E3%82%8C%E3%81%9F%E3%83%90%E3%83%83%E3%83%89%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9","flexBasis":"100%","default":"なし", "type":"text"},

	{"columnId":"appendTextRightTop","columnName":"画像右上追加吹き出し","flexBasis":"100%","default":"", "type":"text"},
	{"columnId":"appendTextLeftBottom","columnName":"画像左下追加吹き出し","flexBasis":"100%","default":"", "type":"text"}

];

const eroStaMode = (io.github.shunshun94.ytsheet.addSkin.param.eroedit || io.github.shunshun94.ytsheet.addSkin.param.mode === 'eroedit') ?
					'edit' : ((io.github.shunshun94.ytsheet.addSkin.param.ero || io.github.shunshun94.ytsheet.addSkin.param.mode === 'ero') ? 'view' : '');

if(eroStaMode) {
	['race-ability', 'birth', 'faith', 'rank', 'status', 'sub-status', 'area-ability', 'level', 'exp'].forEach((id)=>{
		document.getElementById(id).style.display='none';
	});
	const columns = Array.from(document.getElementById('character').getElementsByTagName('article')[0].children);
	columns.forEach((d, i)=>{ if(i > 2 || i === 1){ d.style.display='none'; } });

	eroColumns.forEach((element, num)=>{
		const appendBox = document.createElement('dl');
		appendBox.setAttribute('id', element.columnId);
		appendBox.className ='box';
		appendBox.style.flexBasis = element.flexBasis;
		appendBox.style.order = 6 + num;

		const dt = document.createElement('dt');
		dt.textContent = decodeURI(element.columnName);
		appendBox.append(dt);
		const dd = document.createElement('dd');
		dd.style = element.ddStyle || '';
		if( eroStaMode === 'view' ) {
			dd.textContent = `${decodeURI(io.github.shunshun94.ytsheet.addSkin.param[element.columnId] || element.default)}${element.unit || ''}`;	
		}
		if( eroStaMode === 'edit' ) {
			const input = document.createElement((element.type === 'select') ? 'select' : 'input');
			input.style.width = '100%';
			input.setAttribute('id', `input_${element.columnId}`);
			if(element.type === 'select') {
				element.options.forEach((value)=>{
					const option = document.createElement('option');
					option.value = value;
					option.textContent = value;
					input.append(option);
				});
			} else {
				input.setAttribute('type', element.type);
			}
			input.value = decodeURI(io.github.shunshun94.ytsheet.addSkin.param[element.columnId] || element.default);
			console.log(input.value);
			dd.append(input);
		}
		appendBox.append(dd);

		document.getElementById('personal').append(appendBox);
	});
	document.getElementById('personal').style.gridArea = 'STT';
}

if( eroStaMode === 'edit' ) {
	const send = document.createElement(`button`);
	send.style = `flex-basis: 100%; order: 30;`;
	send.textContent = '保存（サーバには保存されず URL に情報が保持されます！）';
	send.onclick = (e) =>{ 
		const inputs = Array.from(document.getElementById('personal').getElementsByTagName('input')).concat(Array.from(document.getElementById('personal').getElementsByTagName('select')));
		const id = io.github.shunshun94.ytsheet.addSkin.param.id;
		location.href = `./?${sheetIdentifier}&ero=1&${inputs.map((element)=>{ return `${element.id.replace('input_', '')}=${ encodeURI(element.value) }` }).join('&')}`;
	};
	document.getElementById('personal').append(send);
} else if( eroStaMode === 'view' ) {
	document.getElementById('appendTextRightTop').remove();
	document.getElementById('appendTextLeftBottom').remove();
	if(io.github.shunshun94.ytsheet.addSkin.param.appendTextRightTop) {
		const item = document.createElement('span');
		item.id = 'image-append-right-top';
		item.style = `padding:0.8em;top:8px;right:8px;position:absolute;width:3em;writing-mode: vertical-rl;color:black;background-color:white;border:black solid 2px;font-weight: bold;`;
		item.textContent = decodeURI(io.github.shunshun94.ytsheet.addSkin.param.appendTextRightTop);
		document.getElementById('image').append(item);
	}

	if(io.github.shunshun94.ytsheet.addSkin.param.appendTextLeftBottom) {
		const item = document.createElement('span');
		item.id = 'image-append-left-bottom';
