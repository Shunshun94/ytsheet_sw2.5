<div style="position:absolute;bottom:4px;left:4px;" id="appendTextConsole"></div>
<script src="https://shunshun94.github.io/shared/jquery/com/hiyoko/util/v2/utils.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/common.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/store.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/ero.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/pictExport.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/flagments.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/hiyokoFormatCcfoliaJson.js"></script>
<script src="https://shunshun94.github.io/shared/other/io/github/shunshun94/ytsheet/addSkin/modifiedEnemy.js"></script>
<script>
/** 便利機能 **/
if( generateType === 'SwordWorld2PC') {
	// チェック機能
	io.github.shunshun94.ytsheet.addSkin.drawTopMenuButton('チェック', `https://shunshun94.github.io/shared/other/io/github/shunshun94/trpg/sw2/ytsheet/validation/index.html?target=${ encodeURIComponent(location.href) }`);

	// Discord共有用リンク
	const markdownLink = document.createElement('li');
	markdownLink.setAttribute('class', 'link-tag');
	const markdownLinkBase = document.createElement('span');
	markdownLinkBase.appendChild(document.createTextNode('Discord共有用リンク'));
	markdownLinkBase.appendChild(document.createElement('br'));
	const markdownLinkInput = document.createElement('input');
	markdownLinkInput.type = 'text';
	markdownLinkInput.value = `[${document.getElementById('character-name').textContent}](${location.href})`;
	markdownLinkInput.onclick = (e) => { e.target.select(); };
	markdownLinkBase.appendChild(markdownLinkInput);
	markdownLink.appendChild(markdownLinkBase);
	document.getElementById('downloadlist').getElementsByTagName('ul')[0].appendChild(markdownLink);
}

if ( generateType === 'SwordWorld2Enemy' ) {
	io.github.shunshun94.ytsheet.addSkin.drawDownloadButton('downloadlist-picture', '画像形式', (e) => {
		io.github.shunshun94.ytsheet.addSkin.exportPicture.export();
	}, 'downloadlist-zipped');

	if(['蛮族', '動物', '幻獣', '人族'].includes(document.getElementsByClassName('taxa')[0].innerText.trim().replace('分類：', ''))) {
		io.github.shunshun94.ytsheet.addSkin.drawDownloadButton(
            'downloadlist-revenant',
            'レブナント化したデータを出力',
            io.github.shunshun94.ytsheet.addSkin.ModifiedEnemy.beRevenant,
            'downloadlist-zipped',
            false,
            false,
            'jsonデータを出力、ゆとシートでコンバートして使用'
        );
	}

	if((document.getElementsByClassName('taxa')[0].innerText.trim().replace('分類：', '')) === '動物') {
		io.github.shunshun94.ytsheet.addSkin.drawDownloadButton(
            'downloadlist-magi-replica',
            'マギレプリカ化したデータを出力',
            io.github.shunshun94.ytsheet.addSkin.ModifiedEnemy.beMagiReplica,
            'downloadlist-zipped',
            false,
            false,
            'jsonデータを出力、ゆとシートでコンバートして使用'
        );
	}

	io.github.shunshun94.ytsheet.addSkin.drawDownloadButton(
		'downloadlist-hiyoko-ccfolia-json-with-dice-roll',
		'ココフォリア用独自コマデータ',
		(e)=> { io.github.shunshun94.ytsheet.addSkin.HiyokoFormatCcfoliaJson.generate(false); },
		'downloadlist-ccfolia',
		false,
		'剣のかけらの修正値を考慮し、イニシアティブ値とメモ欄をカスタムしたココフォリア用のコマデータを出力します',
		'表示される json をコピーしてココフォリアにはりつけ'
	);

	io.github.shunshun94.ytsheet.addSkin.drawDownloadButton(
		'downloadlist-hiyoko-ccfolia-json-without-dice-roll',
		'ココフォリア用独自コマデータ（固定値使用）',
		(e)=> { io.github.shunshun94.ytsheet.addSkin.HiyokoFormatCcfoliaJson.generate(true); },
		'downloadlist-hiyoko-ccfolia-json-with-dice-roll',
		false,
		'剣のかけらの修正値を考慮し、イニシアティブ値とメモ欄をカスタムしたココフォリア用のコマデータを出力します。命中や回避等のチャットパレットには固定値を用います',
		'表示される json をコピーしてココフォリアにはりつけ'
	);
}

io.github.shunshun94.ytsheet.addSkin.displayEroEditMenu((userId, href) => {
	const targetUserIds = ['302451274706583553', '413974037501313024', '458592433865883659', '272299464486682624', '214107818947641346'];
	const isTargetUser = targetUserIds.includes(userId);
	const isTargetDomain = ! href.includes('hiyo-hitsu.sakura.ne.jp');
	return (isTargetDomain || isTargetUser);
});
</script>
